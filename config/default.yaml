# CoinBot 뼈대 기본 config.
# 거래 정책(사이징·SL/TP·reverse·진입 게이트)은 전략(모델)이 소유한다 — 엔진엔 정책값 없음.
# 정책 임계값은 각 전략의 <strategy.name> 섹션 params 로 둔다.

exchange:
  symbol: "BTC/USDT:USDT"

accounting:
  taker_fee_pct: 0.0005              # 체결 한쪽당 수수료
  slippage_pct: 0.0                  # 체결 한쪽당 슬리피지 근사
  funding_enabled: true              # 백테는 0 반환 (근사 모델 미구현)

backtest:
  initial_balance: 10000.0

data:
  history_bars: 300                  # 백테 시작 전 indicator warmup 캔들 수
  candle_dir: "data/candles"         # 다운로드 캔들 CSV 캐시 경로

logging:
  level: "INFO"
  file: "logs/coinbot.log"
  max_size_mb: 50
  backup_count: 5

strategies:
  active: []                          # 뼈대 상태 — 전략 이름을 추가해야 매매 발생.
                                      # 새 전략: src/strategy/plugins/<name>.py 작성 +
                                      # 아래에 <name>: 섹션 추가 + 이 리스트에 "<name>" 추가.
                                      # 리스트 순서 = 단일 슬롯 경합 시 우선순위.

# ---- 전략 섹션 (전략 추가 시 여기에 <strategy.name>: 블록을 둔다) ----
# 엔진이 강제하는 필수 키는 없다. 정책 임계값은 전략이 자기 params 로 정의하고
# compute_position_size / allow_entry 등에서 읽는다.
# 예:
# my_strategy:
#   risk_per_trade_pct: 0.01
#   max_drawdown_pct: 0.35
#   <전략 고유 파라미터>: ...

# ---- dumb_l3 (Phase 4 멍청3층 — 관문2 경제성 검증용, 현재 비활성) ----
# 배선 재현성 위해 문서화. 활성화하려면 strategies.active 에 "dumb_l3" 추가.
# 관문2 결과 = FAIL-on-cost(엣지 실재하나 거래당엣지≪비용). 상세 MasterPlan §12-7·D-033.
# 예측은 오프라인 박제 아티팩트(oos_export)에서 조회 → θ 방향 → 실진입가 배리어 → 만기 청산.
# ⚠️ 체결해상: fill_tf="1m" 로 1m master(intrabar stop-out 정밀, I-004). 없으면 15m(낙관편향).
dumb_l3:
  artifact_path: "data/research/phase4/oos_predictions_15m_mtf1h.parquet"
  pred_source: "ens"                   # ens(5seed 앙상블) | s0..s4
  theta: 0.40                          # 진입 게이트: max(p_up,p_down) >= theta
  notional: 10000.0                    # 고정 달러 노출(비복리)
  horizon_bars: 24                     # 만기 청산 봉 수(=라벨 N, 6h@15m)
  fill_tf: "1m"                        # 체결 해상 TF(1m 권장, I-004). null=15m master
  mtf_gate: false                      # MTF 역할2: 신호방향·1h추세(mtf1h_kf_slope) 부호 일치시만
  require_dir_gt_expire: false
  allow_reverse: false                 # 라벨 충실: 배리어/만기까지 보유
